services:
  db:
    image: postgres:16-alpine
    container_name: estulanches-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-estulanches}
      POSTGRES_USER: ${POSTGRES_USER:-estu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-estu} -d ${POSTGRES_DB:-estulanches}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]

  app:
    build: .
    image: estulanches-app:${APP_VERSION:-1.0.0}
    container_name: estulanches-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-estu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-estulanches}
    ports:
      - "${APP_PORT:-8000}:8000"
    networks: [interna]

  # Testes de integração contra o PostgreSQL real: docker compose --profile test run --rm tests
  tests:
    build: .
    profiles: ["test"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-estu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-estulanches}
    command: ["npm", "test"]
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:
